[build-system]
requires = ["setuptools>=77", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "qupyt"
dynamic = ["version"]
description = "Provide a framework for quantum sensing experiments"
license = {text = "No license of for commercial or non-commercial use is granted"}
requires-python = ">=3.14"
dependencies = [
    "numpy",
    "PyYAML",
    "pydantic",
    "pydantic-settings>=2.16",
    "termcolor",
    "tqdm",
    "watchdog==7.1.0",
]
#author = "Karl Briegel"
#author_email = "karl.briegel@tum.de"

# Hardware drivers, one extra per device family, e.g. pip install qupyt[basler].
# Not on PyPI, install from the vendor: egrabber (Euresys, PhantomS710),
# libHeLIC (Heliotis, HeliC3), SpinAPI (SpinCore, PulseBlaster).
[project.optional-dependencies]
basler = ["pypylon"]
daq = ["nidaqmx"]
genicam = ["harvesters"]
pulsestreamer = ["pulsestreamer"]
windfreak = ["windfreak", "pyserial"]
konrad = ["pyserial"]
visa = ["PyVISA", "pyvisa-py"]
tekawg = ["PyVISA", "pyvisa-py", "matplotlib"]
all = ["qupyt[basler,daq,genicam,pulsestreamer,windfreak,konrad,visa,tekawg]"]

[project.scripts]
qupyt = "qupyt.main:main"

[tool.setuptools.packages]
find = {}

[tool.setuptools_scm]
version_file = "qupyt/_version.py"

[tool.mypy]
plugins = ["pydantic.mypy"]
check_untyped_defs = true
ignore_missing_imports = true
warn_unused_configs = true
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
no_implicit_reexport = true
strict_equality = true
warn_unreachable = true
disallow_any_unimported = true
show_column_numbers = true
# disallow_any_expr = true
# disallow_any_explicit = true
strict = true
follow_imports = "normal"
strict_optional = true
# mypy_path = ["qupyt"]
files = ["qupyt"]

[tool.pylsp]
configurationSources = ["pyproject.toml"]

[tool.pylsp.plugins.pylint]
enabled = true
args = ["--disable=line-too-long",
"--enable=logging-format-interpolation",
"--disable=logging-fstring-interpolation"]
# disable = ["logging-format-interpolation", "logging-not-lazy"]

[tool.pytest.ini_options]
pythonpath = ["."]
