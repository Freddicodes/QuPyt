[build-system]
requires = ["setuptools", "setuptools_scm"]
build-backend = "setuptools.build_meta"

[project]
name = 'qupyt'
#version = '0.1.0'
dynamic = ["version"]
description = 'Provide a framework for quantum sensing experiments'
license = {text = 'No license of for commercial or non-commercial use is granted'}
dependencies = [
    'numpy', 
    'PyYAML',
    'pydantic',
    'watchdog',
    'tqdm',
    'termcolor',
    'pyserial',
    'PyVISA',
    'pyvisa-py'
]
authors =  [
    { name = "Karl Briegel", email = "karl.briegel@tum.de" },
    { name = "Julia Draeger", email = "julia.draeger@tum.de" }
]
maintainers = [
    { name = "Julia Draeger", email = "julia.draeger@tum.de" }
]

[project.optional-dependencies]
basler          = ['pypylon']
genicam         = ['harvesters']
daq             = ['nidaqmx']
pulsestreamer   = ['pulsestreamer']
windfreak       = ['windfreak']
plot            = ['matplotlib']
all             = ["qupyt[basler,genicam,daq,pulsestreamer,windfreak,plot]"]

[tool.setuptools.packages.find]
include = ["qupyt*"]
# disables automatic namespace import
namespaces = false

[tool.setuptools_scm]
write_to = "qupyt/_version.py"

[project.scripts]
qupyt = "qupyt.main:main"

[tool.mypy]
check_untyped_defs = true
ignore_missing_imports = true
warn_unused_configs = true
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
no_implicit_reexport = true
strict_equality = true
warn_unreachable = true
disallow_any_unimported = true
show_column_numbers = true
# disallow_any_expr = true
# disallow_any_explicit = true
strict = true
enable_recursive_aliases = true
follow_imports = 'normal'
strict_optional = true
# mypy_path = ['qupyt']
files = ['qupyt']

[tool.pylsp]
configurationSources = ["pyproject.toml"]

[tool.pylsp.plugins.pylint]
enabled = true
args = [
    "--disable=line-too-long,logging-fstring-interpolation",
    "--enable=logging-format-interpolation",
]
